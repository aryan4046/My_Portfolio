<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915EFF" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Background Ring (Static) -->
  <circle cx="50" cy="50" r="45" stroke="#ffffff20" stroke-width="4" fill="none" />
  
  <!-- Rotating Arcs -->
  <g transform-origin="50 50">
    <path d="M 50 5 A 45 45 0 0 1 95 50" stroke="url(#logo-grad)" stroke-width="4" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 50 95 A 45 45 0 0 1 5 50" stroke="url(#logo-grad)" stroke-width="4" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Text -->
  <text x="50" y="68" font-size="42" font-weight="900" text-anchor="middle" fill="white" font-family="sans-serif" style="filter: drop-shadow(0px 0px 4px rgba(0,0,0,0.5));">AS</text>
</svg>
